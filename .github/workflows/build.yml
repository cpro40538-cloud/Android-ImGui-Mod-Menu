name: Build ImGui Menu

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code & Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cai NDK 25.1.8937393 & Ep Gradle doc
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

    - name: Fix NDK & Vua mat tac gia
      run: |
        # Fix loi phien ban NDK
        sed -i 's/24\.0\.7856742/25.1.8937393/g' app/build.gradle
        sed -i 's/24\.0\.7856742/25.1.8937393/g' build.gradle || true

        # Nhét lại đường dẫn Dobby vào đúng chỗ an toàn (khỏi bị xóa)
        sed -i 's|LOCAL_C_INCLUDES += $(LOCAL_PATH)/xdl/include|LOCAL_C_INCLUDES += $(LOCAL_PATH)/xdl/include $(LOCAL_PATH)/../Include $(LOCAL_PATH)/../Include/Dobby|g' app/src/main/jni/Build/Android.mk

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393 ./gradlew assembleDebug --stacktrace

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod Menu Demo
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 1
